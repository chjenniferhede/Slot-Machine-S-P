[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slotmachine"
version = "0.1.0"
description = "A secure, auditable slot machine for Big Casino"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi==23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "mypy==1.11.2",
]

[project.scripts]
slotmachine = "slotmachine.__main__:main"
slotmachine-rtpcalc = "slotmachine.tools.rtpcalc:main"

[tool.setuptools.packages.find]
where = ["src"]

# Data files the code reads with importlib.resources. Without these lines a
# regular (non-editable) install would ship without the schema, the games
# or the web pages.
[tool.setuptools.package-data]
slotmachine = ["schema.sql"]
"slotmachine.game" = ["specs/*.json"]
"slotmachine.web" = ["static/*.html", "static/*.js", "static/*.css", "static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The slow tests take minutes, so a plain `pytest` leaves them out.
# `pytest -m slow` runs them; a later -m replaces this one.
addopts = "-m 'not slow'"
markers = [
    "slow: long-running soak and convergence tests, left out unless run with -m slow",
]

[tool.mypy]
strict = true
files = [
    "src/slotmachine/money.py",
    "src/slotmachine/storage.py",
    "src/slotmachine/rng.py",
    "src/slotmachine/audit.py",
    "src/slotmachine/auth.py",
    "src/slotmachine/__main__.py",
    "src/slotmachine/payment.py",
    "src/slotmachine/accounts.py",
    "src/slotmachine/stats.py",
    "src/slotmachine/technician.py",
    "src/slotmachine/commissioner.py",
    "src/slotmachine/game",
    "src/slotmachine/cli",
    "src/slotmachine/web",
]
